services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: relay
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [database:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U relay -d relay]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      NODE_ENV: production
      PORT: 3001
      APP_ORIGIN: https://${APP_DOMAIN:?Set APP_DOMAIN in .env}
      QR_BASE_URL: https://${QR_DOMAIN:?Set QR_DOMAIN in .env}
      PUBLIC_BASE_URL: https://${APP_DOMAIN}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: relay
      DB_NAME: relay
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in .env}
      EMAIL_HOST: ${EMAIL_HOST:?Set EMAIL_HOST in .env}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:?Set DEFAULT_FROM_EMAIL in .env}
      COOKIE_SECURE: "true"
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      TRUST_PROXY: "1"
    depends_on:
      db: { condition: service_healthy }
    volumes: [./backups:/app/backups]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      API_UPSTREAM: http://api:3001
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
  edge:
    image: caddy:2-alpine
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      QR_DOMAIN: ${QR_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    volumes:
      - ./deployment/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api]
    restart: unless-stopped
volumes:
  database:
  caddy_data:
  caddy_config:
